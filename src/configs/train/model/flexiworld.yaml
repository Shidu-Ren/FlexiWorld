_target_: flexiworld.models.world_model.VarKJEPA
primitive_dim: ${action_dim}
k_max: 10
prev_mode: k1

intent_mode: goal_displacement
predict_residual: false
actor_warmstart: true

encoder:
  _target_: stable_pretraining.backbone.utils.vit_hf
  size: tiny
  patch_size: 14
  image_size: ${img_size}
  pretrained: false
  use_mask_token: false

predictor:
  _target_: flexiworld.models.layers.ARPredictor
  num_frames: ${history_size}
  input_dim: ${embed_dim}
  hidden_dim: ${embed_dim}
  output_dim: ${embed_dim}
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

action_encoder:
  _target_: flexiworld.models.action.VarKActionEncoder
  action_dim: ${action_dim}
  k_max: 10
  emb_dim: ${embed_dim}

intent_actor:
  _target_: flexiworld.models.action.ARPrimitiveActor
  embed_dim: ${embed_dim}
  action_emb_dim: ${embed_dim}
  action_dim: ${action_dim}
  k_max: 10
  use_k_token: false
  use_temporal_conditioning: false

projector:
  _target_: flexiworld.models.layers.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true

pred_proj:
  _target_: flexiworld.models.layers.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true
