world:
  env_name: swm/ReacherDMControl-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  task: qpos_match
dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
  - action
eval:
  num_eval: 100
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: dmc/reacher_random
  callables:
  - method: set_state
    args:
      qpos:
        value: qpos
      qvel:
        value: qvel
  - method: set_target_qpos
    args:
      target_qpos:
        value: goal_qpos
