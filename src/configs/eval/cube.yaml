world:
  env_name: swm/OGBCube-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  env_type: single
  ob_type: states
  multiview: false
  width: 224
  height: 224
  visualize_info: false
  terminate_at_goal: true
dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
  - action
eval:
  num_eval: 100
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: ogbench/cube_single_expert
  callables:
  - method: set_state
    args:
      qpos:
        value: qpos
      qvel:
        value: qvel
  - method: set_target_pos
    args:
      cube_id:
        value: 0
        in_dataset: false
      target_pos:
        value: goal_privileged_block_0_pos
      target_quat:
        value: goal_privileged_block_0_quat
